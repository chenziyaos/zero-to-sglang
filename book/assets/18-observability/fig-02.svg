<g id="a1:29" transform="translate(56, 632.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">只要慢请求明显多于 1%，p99 就是一条 2.0 s 附近的横线，真实值在 1.2 还是 1.9 画出来一样。</tspan></tspan></text></g>
<g id="a1:30" transform="translate(56, 654.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">TTFT、ITL、E2E 的桶可以用 --bucket-* 参数在 SLO 附近加密，比如 SLO 1.5 s 时在 1 到 2 之间加 1.2、1.4、1.5、1.6、1.8。</tspan></tspan></text></g>
<g id="a1:31" transform="translate(56, 677.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">流式体验看 ITL，每条请求平均多快看 TPOT；两者差 4.1 倍时，多出来的是 prefill 插进来时 decode 停下的那几步。</tspan></tspan></text></g>
