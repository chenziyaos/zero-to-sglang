<g id="a1:9" transform="translate(40, 324.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">位置 =（636.6 − 519）÷ 124 = 0.948，估值 = 1 + 0.948 × 1 = 1.948 s</tspan></tspan></text></g>
<g id="a1:10" transform="translate(40, 348.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d83931" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">同一段时间逐请求日志里的真实值是 1.62 s，直方图多估了 0.33 s</tspan></tspan></text></g>
