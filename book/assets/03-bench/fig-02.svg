<g id="a1:23" transform="translate(56, 531.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">读法</tspan></tspan></text></g>
<g id="a1:24" transform="translate(56, 562.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">吞吐几乎一样，固定并发的 TTFT 反而高一个数量级：64 条一起 prefill、一起结束，下一批 64 条又一起进来。</tspan></tspan></text></g>
<g id="a1:25" transform="translate(56, 584.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">--random-range-ratio 改成 0.5 把长度打散，c=64 的 p50 从 931 ms 降到 25 ms，成批同步就没了。</tspan></tspan></text></g>
<g id="a1:26" transform="translate(56, 607.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">容量规划要的是按到达率压出来的数，后文的扫描都用它。</tspan></tspan></text></g>
</svg>