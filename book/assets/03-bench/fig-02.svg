<svg xmlns="http://www.w3.org/2000/svg"
     width="1240"
     height="730"
     viewBox="-20 -20 1240 730">
<g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="690" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">固定并发压出来的延迟，回答的是另一个问题</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">同一台机器：固定并发 c=64 对比按泊松到达率压；固定长度请求同时发出时会成批同步</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 651.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：配套 03-bench 模拟器；bench_serving 的 --max-concurrency、--request-rate、--random-range-ratio</tspan></tspan></text></g>
<g id="o1:2" transform="translate(40, 130)"><rect x="0" y="0" width="540" height="150" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="10" ry="10"/></g>
<g id="a1:4" transform="translate(54, 140.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">按到达率压（开放模型）</tspan></tspan></text></g>
<g id="a1:5" transform="translate(54, 168.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">--request-rate 有限值，间隔服从均值 1/λ 的指数分布</tspan></tspan></text></g>
<g id="a1:6" transform="translate(54, 189.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">到点就发，不管前面的回没回来</tspan></tspan></text></g>
<g id="a1:7" transform="translate(54, 211.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">服务端变慢时排队时间急剧上升</tspan></tspan></text></g>
<g id="a1:8" transform="translate(54, 232.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">回答「这台机器能接多大流量」</tspan></tspan></text></g>
<g id="o1:3" transform="translate(620, 130)"><rect x="0" y="0" width="540" height="150" fill="#fff1e0" stroke="#ffba6b" stroke-width="1" rx="10" ry="10"/></g>
<g id="a1:9" transform="translate(634, 140.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#d46b08" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">按并发压（封闭模型）</tspan></tspan></text></g>
<g id="a1:10" transform="translate(634, 168.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">--max-concurrency C，回来一条才发下一条</tspan></tspan></text></g>
<g id="a1:11" transform="translate(634, 189.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">服务端变慢，客户端跟着少发（coordinated omission）</tspan></tspan></text></g>
<g id="a1:12" transform="translate(634, 211.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">信号量上的等待不计入 TTFT</tspan></tspan></text></g>
<g id="a1:13" transform="translate(634, 232.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">回答「固定并发下单请求要等多久」</tspan></tspan></text></g>
<g id="a1:14" transform="translate(40, 302.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">同一台机器的 TTFT（ms）</tspan></tspan></text></g>
<g id="a1:15" transform="translate(140, 341.729)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="end" dominant-baseline="alphabetic" x="168"><tspan x="168" y="16.471"><tspan x="-6.81" text-anchor="start">c=64 · p99（13.31 req/s）</tspan></tspan></text></g>
