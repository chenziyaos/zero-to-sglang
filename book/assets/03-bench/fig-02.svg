<g id="a1:21" transform="translate(146, 455.729)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="end" dominant-baseline="alphabetic" x="162"><tspan x="162" y="16.471"><tspan x="-5.73" text-anchor="start">按到达率 13.8 req/s · p99</tspan></tspan></text></g>
<g id="o1:10" transform="translate(320, 454)"><rect x="0" y="0" width="600" height="26" fill="#f2f3f5" stroke="#f2f3f5" stroke-width="1" rx="4" ry="4"/></g>
