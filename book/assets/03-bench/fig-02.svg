<g id="a1:18" transform="translate(628, 380.9055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">931 ms</tspan></tspan></text></g>
<g id="a1:19" transform="translate(154, 417.729)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="end" dominant-baseline="alphabetic" x="154"><tspan x="154" y="16.471"><tspan x="-2.66" text-anchor="start">c=64 长度打散 0.5 · p50</tspan></tspan></text></g>
<g id="o1:8" transform="translate(320, 416)"><rect x="0" y="0" width="600" height="26" fill="#f2f3f5" stroke="#f2f3f5" stroke-width="1" rx="4" ry="4"/></g>
