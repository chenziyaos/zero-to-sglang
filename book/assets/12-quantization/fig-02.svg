<g id="a1:38" transform="translate(56, 584.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">INT8 逐张量 6.47% 是离群值的代价，LLM.int8() 的混合精度分解就是为了绕开它。</tspan></tspan></text></g>
<g id="a1:39" transform="translate(56, 607.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">4 bit 档 16 个格点覆盖不了一整个通道，所以分组：GPTQ、AWQ 多出 0.125 到 0.156 位；AWQ 多一个零点，误差从 15.70% 降到 11.73%。</tspan></tspan></text></g>
<g id="a1:40" transform="translate(56, 629.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">NVFP4 每 16 个一组、scale 用 FP8，多花 0.25 位换来 4 bit 档最低的 9.46%。</tspan></tspan></text></g>
