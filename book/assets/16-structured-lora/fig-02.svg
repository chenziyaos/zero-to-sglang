<g id="a1:37" transform="translate(56, 707.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">没开 overlap 时这段时间直接加在每步上；开了 overlap，超过 decode 一步的部分才露出来。</tspan></tspan></text></g>
