<g id="a2:40" transform="translate(66, 601.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">读法（排队时间为 0 的情况）</tspan></tspan></text></g>
<g id="a2:41" transform="translate(66, 632.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">默认名义预算 = 1 s + 512 页 × 64/1024 × 0.25 s = 9.0 s，重算整段只要 0.94 s；慢存储上 timeout 策略在模型里把等待拖到近 10 s，真实墙钟还要再加轮询和跨 rank 同步。</tspan></tspan></text></g>
<g id="a2:42" transform="translate(66, 654.61725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">best_effort 不等，排队时间为 0 时一页都拿不到，直接重算；队列里排得越久，它拿到的越多。</tspan></tspan></text></g>
<g id="a2:43" transform="translate(66, 677.11725)"><text font-size="13.5" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.883"><tspan x="0" text-anchor="start">启发式定参：按「每页等待不超过重算这一页」给预算，本例 prefetch_timeout_per_ki_token ≈ 0.012；base 用自己集群的实测首包延迟覆盖，不要直接套脚本默认值。</tspan></tspan></text></g>
</svg>