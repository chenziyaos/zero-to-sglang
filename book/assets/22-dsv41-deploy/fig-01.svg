<g id="a1:3" transform="translate(40, 791.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：SGLang cookbook、KTransformers 文档、Unsloth GGUF 文档、LMSYS SSD Expert Pack 博客；分档阈值为作者按权重体积估算</tspan></tspan></text></g>
