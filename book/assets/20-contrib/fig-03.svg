<g id="a1:16" transform="translate(56, 411.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">怎么用这组数</tspan></tspan></text></g>
<g id="a1:17" transform="translate(56, 442.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">这里的 TTFT 含高负载下的排队，读回省掉的是 prefill 的排队和计算；空载时重算本身很快，差距会缩小</tspan></tspan></text></g>
<g id="a1:18" transform="translate(56, 464.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">PR 讨论给出的经验：链路一般时，25K token 以下的前缀重算可能更快，因为读回要付网络和反序列化的固定开销</tspan></tspan></text></g>
<g id="a1:19" transform="translate(56, 486.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">上线前用自己的前缀长度分布和存储链路各压一组，命中率高但前缀短的业务不一定该开 L3</tspan></tspan></text></g>
