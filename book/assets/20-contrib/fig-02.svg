<g id="a1:25" transform="translate(406, 362.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">Kimi-Linear 每 rank 127.8 → 90.8 GiB，省下的 37 GiB 回到 KV 容量</tspan></tspan></text></g>
<g id="a1:26" transform="translate(406, 384.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">草稿和目标的分配、释放走同一套记账，不会一边满了另一边还空着</tspan></tspan></text></g>
