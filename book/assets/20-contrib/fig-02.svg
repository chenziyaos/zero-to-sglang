<g id="a1:27" transform="translate(56, 471.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">前提条件</tspan></tspan></text></g>
<g id="a1:28" transform="translate(56, 502.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">草稿层必须是稠密全注意力的 K/V，形状能放进目标池的槽位；不满足时回退到独立池，或者启动时直接拒绝</tspan></tspan></text></g>
<g id="a1:29" transform="translate(56, 524.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">启动日志里能看到走的是哪条路，上线前确认一次，别默认以为省到了显存</tspan></tspan></text></g>
