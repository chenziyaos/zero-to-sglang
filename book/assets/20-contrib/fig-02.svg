<g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1200" height="640" fill="#fafbfd" stroke="#dee0e3" stroke-width="1" rx="16" ry="16"/></g>
<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">草稿层不再自带 KV 池，借用目标模型的槽位</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">融合草稿 KV：草稿层写入时拿到的是虚拟 ID，经一张映射表翻译成目标模型池里的物理槽位</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 601.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：sglang PR #37628、#40491、#40492 描述；Kimi-Linear 显存为 PR 中每 rank 实测</tspan></tspan></text></g>
<g id="o1:2" transform="translate(40, 130)"><rect x="0" y="0" width="300" height="300" fill="#f5f6f7" stroke="#dee0e3" stroke-width="1" rx="12" ry="12"/></g>
