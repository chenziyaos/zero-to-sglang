<g id="a1:33" transform="translate(56, 472.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">默认 lru；有少量必须常驻的前缀（系统提示词、工具描述）用 priority 并在请求里给 priority；多轮对话、TTFT SLO 紧的场景试 tlru（只有 Unified 树支持）</tspan></tspan></text></g>
<g id="a1:34" transform="translate(56, 494.7055)"><text font-size="13" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="15.295"><tspan x="0" text-anchor="start">lfu / slru 只在热点长期稳定时有用，热点一迁移就会把旧内容钉在树里</tspan></tspan></text></g>
