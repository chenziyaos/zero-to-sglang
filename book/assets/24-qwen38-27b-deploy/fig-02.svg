<g id="a1:19" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">H200 141GB，FP8，EAGLE(MTP) 3/1/4，fp32 状态，FP8 KV，平均请求 9216 token，估算</tspan></tspan></text></g>
<g id="a1:20" transform="translate(40, 583.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：作者按 plan.py 用 SGLang Cookbook 公式估算；真实上限以启动日志 max_running_requests 为准</tspan></tspan></text></g>
<g id="a1:21" transform="translate(40, 109.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">引擎默认 --mamba-full-memory-ratio 0.9</tspan></tspan></text></g>
<g id="o1:8" transform="translate(40, 140)"><rect x="0" y="0" width="212.1" height="56" fill="#f3e8ff" stroke="#c39bf5" stroke-width="1" rx="6" ry="6"/></g>
