<g id="o1:11" transform="translate(407.7, 290)"><rect x="0" y="0" width="80.1" height="56" fill="#e1eaff" stroke="#82a7fc" stroke-width="1" rx="6" ry="6"/></g>
<g id="a1:28" transform="translate(399.3, 306.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="middle" dominant-baseline="alphabetic" x="48.5"><tspan x="48.5" y="16.471"><tspan x="3.4" text-anchor="start">KV 池 15.7 GiB</tspan></tspan></text></g>
<g id="a1:29" transform="translate(40, 359.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#7b2fd4" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">状态池先卡住：约 55 并发（每请求 9 槽 × 153.9 MB）</tspan></tspan></text></g>
<g id="a1:30" transform="translate(640, 359.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">KV 池约 51.5 万 token（按 9216/请求约 55 条）</tspan></tspan></text></g>
<g id="o1:12" transform="translate(40, 448)"><rect x="0" y="0" width="1120" height="118" fill="#fff7e6" stroke="#ffba6b" stroke-width="1" rx="10" ry="10"/></g>
<g id="a1:31" transform="translate(60, 462.3525)"><text font-size="15" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">为什么默认值会误伤：</tspan></tspan></text></g>
<g id="a1:32" transform="translate(60, 489.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">一个状态槽折合约 4698 个 KV token，每请求却只带 9216 token 的 KV；默认按 0.9 把大头分给 KV，</tspan></tspan></text></g>
<g id="a1:33" transform="translate(60, 513.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">状态槽数先见底，多出来的 KV 用不上。平衡式：r =（S + D）× 状态字节 ÷（L × 每 token KV 字节），唯一自由变量是平均请求长度 L。</tspan></tspan></text></g>
<g id="a1:34" transform="translate(60, 537.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">想钉死并发用 --max-mamba-cache-size = 目标并发 × S（D 不乘），启动后核对日志 max_running_requests 不被压低。</tspan></tspan></text></g>
</svg>