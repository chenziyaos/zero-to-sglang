<g id="a1:24" transform="translate(40, 209.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#7b2fd4" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">状态池先卡住：约 32 并发（每请求 9 槽 × 153.9 MB）</tspan></tspan></text></g>
<g id="a1:25" transform="translate(640, 209.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#245bdb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">KV 池约 151.4 万 token（按 9216/请求约 164 条）</tspan></tspan></text></g>
<g id="a1:26" transform="translate(40, 259.176)"><text font-size="16" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">平衡值 4.59（L=9216，S=5，D=4）</tspan></tspan></text></g>
<g id="o1:10" transform="translate(40, 290)"><rect x="0" y="0" width="367.7" height="56" fill="#f3e8ff" stroke="#c39bf5" stroke-width="1" rx="6" ry="6"/></g>
