<g id="a1:70" transform="translate(56, 827.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">RadixArk 两份声明 KV 走 FP8；nvidia 版没有 kv_cache_scheme，选 Auto 会回 BF16，所以配方一律显式 --kv-cache-dtype fp8_e4m3。</tspan></tspan></text></g>
