<g id="a1:10" transform="translate(56, 321.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">chunked_prefill_size = 8192，decode max_bs = 256</tspan></tspan></text></g>
<g id="a1:11" transform="translate(56, 344.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">reserved = 512 + 8192×1.5 + 1/8×1024 + graph</tspan></tspan></text></g>
<g id="a1:12" transform="translate(56, 367.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">graph = 256×2 + 58 个 prefill 档×8 = 976 MB</tspan></tspan></text></g>
<g id="a1:13" transform="translate(56, 390.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">reserved = 13904 MB（高于 10 GB 下限）</tspan></tspan></text></g>
<g id="a1:14" transform="translate(56, 413.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">mem_fraction_static = (81559−13904)/81559 = 0.83</tspan></tspan></text></g>
<g id="o1:7" transform="translate(620, 280)"><rect x="0" y="0" width="540" height="190" fill="#e4fae1" stroke="#8ee085" stroke-width="1" rx="12" ry="12"/></g>
