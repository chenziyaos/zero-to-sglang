<g id="a1:1" transform="translate(40, 25.058)"><text font-size="28" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="bold" fill="#1f2329" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="32.942"><tspan x="0" text-anchor="start">H100 80GB 跑 Qwen3-8B：KV 池拿到约 50 GiB</tspan></tspan></text></g>
<g id="a1:2" transform="translate(40, 75.529)"><text font-size="14" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">按主干默认启发式推算；实测以启动日志为准，偏差主要来自 CUDA 上下文和 NCCL 缓冲</tspan></tspan></text></g>
<g id="a1:3" transform="translate(40, 481.882)"><text font-size="12" font-family="Noto Sans SC, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="normal" fill="#646a73" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">来源：memory_hook.py、cuda_graph_hook.py、kv_cache_configurator.py 的公式；Qwen3-8B config.json；配套 01-first-server/estimate_startup.py</tspan></tspan></text></g>
